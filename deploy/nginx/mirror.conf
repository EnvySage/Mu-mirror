# /etc/nginx/conf.d/mirror.conf
#
# 站点入口端口：10000（本项目服务已整体避开 8000-9000 段）
# 换完执行：sudo nginx -t && sudo systemctl reload nginx
#
# 注意：非 80/443 端口无法用 certbot --nginx 自动签证书（http-01 校验要求 80）
#       IP 直访场景不需要 HTTPS，可忽略

server {
    listen 10000;
    server_name _;   # ← 换成你的域名；用 IP 直访就保持 _

    root /opt/mirror/frontend/current;    # current 是软链，发版只切链不重载 nginx
    index index.html;

    # vault 单文件 20MB + 表单余量
    client_max_body_size 25m;

    # 前端 SPA：前端路由（/chat、/settings…）刷新不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不缓存：否则发版后浏览器还拿旧壳（它引用的 assets 已换 hash）
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 后端 API（前端 baseURL 就是 /api → 天然同源，不需要 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:10002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠ 对话是 SSE 流式：这三行必须要有，否则思考过程/逐字输出会被 nginx 攒成一坨最后一起吐
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # LLM 流式回答最长 60s（后端 SseEmitter 120s 超时），给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
