syntax = "proto3";

package mirror;

option java_package = "org.xianshen.mumirrorb.grpc.gen";
option java_outer_classname = "CommonProto";

// 情绪标签（13 种，固定枚举）
enum MoodType {
  MOOD_UNKNOWN = 0;
  HAPPY = 1;
  EXCITED = 2;
  SATISFIED = 3;
  GRATEFUL = 4;
  EXPECTING = 5;
  CALM = 6;
  BORED = 7;
  CONFUSED = 8;
  ANXIOUS = 9;
  SAD = 10;
  ANGRY = 11;
  EXHAUSTED = 12;
  STRESSED = 13;
}

// 内容类型（8 种，固定枚举）
enum ContentType {
  CONTENT_UNKNOWN = 0;
  TODO = 1;
  THOUGHT = 2;
  LEARNING = 3;
  PLAN = 4;
  NOTE = 5;
  WORK = 6;
  SOCIAL = 7;
  HEALTH = 8;
}

// 任务状态（仅待办/计划类有效）
enum TaskStatus {
  STATUS_UNKNOWN = 0;
  NOT_STARTED = 1;
  IN_PROGRESS = 2;
  COMPLETED = 3;
}

// 模型协议
enum AiProtocol {
  PROTOCOL_UNKNOWN = 0;
  OPENAI = 1;       // OpenAI 兼容协议（OpenAI、通义千问、智谱等）
  ANTHROPIC = 2;    // Anthropic 协议（Claude 系列）
}

// LLM 配置（每次请求携带）
message LlmConfig {
  string provider = 1;      // openai / zhipu / qwen
  AiProtocol protocol = 2;  // 模型协议：openai / anthropic
  string api_key = 3;
  string base_url = 4;      // 可选，留空用默认
  string model = 5;         // 模型名称
}

// 用户个人词典词条（lexicon-design.md v1.0）：confirmed 才生效，随 gRPC 请求携带（Python 无状态铁律）
message GlossaryTerm {
  string term = 1;             // 词条本身
  string description = 2;      // 用户确认的解释
  repeated string aliases = 3; // 别名（如 ["毕设","那个设计"]）
  string confirmed_at = 4;     // 最后确认日期 ISO（yyyy-MM-dd），prompt 标注"x月确认"
}

// chunk 语料条目（ExtractTerms 抽取语料；字段与 chunks 表 / metadata JSONB 对齐）
message ChunkDTO {
  int64 chunk_id = 1;
  int64 record_id = 2;
  string segment = 3;          // 主题片段（embedding 文本；空时回退 content）
  string content = 4;          // 整条记录原文
  string title = 5;            // metadata.title
  string summary = 6;          // metadata.summary
  string content_type = 7;     // 8 类英文小写
  repeated string moods = 8;   // 13 情绪英文小写
  repeated string keywords = 9;
  string task_status = 10;     // not_started/in_progress/completed；非待办类为空
  string created_at = 11;      // 记录时间（YYYY-MM-DDTHH:mm:ss）
  bool user_edited = 12;       // 用户编辑过（抽取语料权重优先依据）
}

// 工具定义（toolcalling-vault-design.md 第 6 节）：Java 注册表快照随 PlanToolsRequest.tools 传 Python
message ToolSpec {
  string name = 1;          // 工具名（B 侧执行查找键，如 search_records）
  string description = 2;   // 用途描述（Python prompt 逐条渲染）
  string args_schema = 3;   // 参数说明（JSON Schema 简化文本，prompt 渲染）
}

// 工具执行结果（B 执行后塞 ChatRequest.tool_results，Python 渲染成上下文块）
message ToolResult {
  string tool = 1;          // 工具名
  string summary = 2;       // 输出摘要（进 meta.tools_used 轨迹芯片）
  string payload_json = 3;  // 完整结果 JSON（进 prompt 上下文块）
  bool success = 4;         // 执行成败（false 时 Python 只渲染失败说明，不把失败 payload 喂给 LLM）
}

// Embedding 配置（每次请求携带）
message EmbeddingConfig {
  string source = 1;        // local / api
  string local_model = 2;   // 本地模型名，如 "BAAI/bge-m3"
  string api_provider = 3;
  string api_key = 4;
  string api_model = 5;
  string base_url = 6;      // API 地址（可选，留空用默认）
}
