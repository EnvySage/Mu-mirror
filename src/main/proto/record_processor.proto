syntax = "proto3";

package mirror;

import "common.proto";

option java_package = "org.xianshen.mumirrorb.grpc.gen";
option java_outer_classname = "RecordProcessorProto";

// 记录处理服务
service RecordProcessor {
  // 分类：输入文本，返回标题/摘要/标签
  rpc Classify (ClassifyRequest) returns (ClassifyResponse);
}

// 分类请求
message ClassifyRequest {
  string content = 1;
  LlmConfig llm_config = 2;  // LLM 配置（每次请求携带）
}

// 分类响应（支持拆分：一次 LLM 调用可能返回多条结果）
message ClassifyResponse {
  bool skip = 1;                    // 是否跳过（无意义内容）
  string skip_reason = 2;           // 跳过原因
  repeated ClassifyItem items = 3;  // 分类结果（1条或多条，拆分后的每条记录）
}

// 单条分类结果
message ClassifyItem {
  string title = 1;                 // 标题（10字以内）
  string summary = 2;               // 摘要（30字以内）
  string content = 3;               // 原文片段（拆分后对应的原文内容）
  ContentType content_type = 4;     // 内容类型
  repeated MoodType moods = 5;      // 情绪（多选）
  TaskStatus status = 6;            // 状态（仅待办/计划类）
  repeated string keywords = 7;     // 关键词 3-5 个
}
