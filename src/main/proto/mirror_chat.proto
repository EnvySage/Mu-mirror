syntax = "proto3";
package mirror;

import "common.proto";

option java_package = "org.xianshen.mumirrorb.grpc.gen";
option java_outer_classname = "MirrorChatProto";

service MirrorChat {
  rpc ExtractIntent(ExtractIntentRequest) returns (ExtractIntentResponse);
  rpc Chat(ChatRequest) returns (stream ChatChunk);
  // 工具计划（toolcalling-vault-design.md 第 1/6 节）：LLM 按 JSON 约定输出 ≤2 步工具调用计划；
  // 失败/超时(3s)/空计划 → B 侧跳过走现有 RAG，零回归
  rpc PlanTools(PlanToolsRequest) returns (PlanToolsReply);
  // 对话 Agent 循环（chat-loop-design.md §3）：Java 驱动，每步调一次，带上已执行结果；
  // 服务端流式，先吐 thinking 增量（B 透传 SSE thinking，等待可感知），终帧给 calls/done
  rpc PlanNextStep(PlanNextStepRequest) returns (stream PlanStepChunk);
}

// 工具计划请求
message PlanToolsRequest {
  string question = 1;                    // 用户原始提问
  repeated GlossaryTerm glossary = 2;     // confirmed 个人词典（与对话同口径）
  repeated ToolSpec tools = 3;            // Java 注册表快照（ToolSpec 定义在 common.proto）
  LlmConfig llm_config = 4;
}

// 工具计划响应
message PlanToolsReply {
  repeated PlannedCall calls = 1;         // ≤2 步；空 = 不用工具
}

message PlannedCall {
  string tool = 1;        // 工具名（须在注册表内，否则 B 侧跳过）
  string args_json = 2;   // 参数 JSON 文本（B 侧解析执行）
}

message ExtractIntentRequest {
  string query = 1;
  LlmConfig llm_config = 2;
  repeated GlossaryTerm glossary = 3; // 命中 query 的词条（B 侧 query 匹配，未命中传 top 高频词 grounding）
}

message ExtractIntentResponse {
  // query_type 四选一（英文小写）：profile / structured / semantic / hybrid
  // PROFILE→查画像快照；STRUCTURED→元数据过滤；SEMANTIC→纯向量；HYBRID→过滤+向量+时间衰减
  string query_type = 1;
  optional string content_type = 2;  // 8 类英文小写（todo/thought/learning/plan/note/work/social/health），无法确定则不填
  repeated string moods = 3;         // 13 情绪英文小写
  string time_range = 4;             // 如 "最近7天"，空表示未提及
  string rewritten_query = 5;        // 改写后的检索 query
}

message ChatRequest {
  string question = 1;
  repeated ChatMessage history = 2;
  repeated RetrievedChunk chunks = 3;
  LlmConfig llm_config = 4;
  repeated GlossaryTerm glossary = 5;      // 用户个人词典（confirmed top 30，软约束注入）
  repeated ToolResult tool_results = 6;    // 工具执行结果（PlanTools→执行→塞入；空=未走工具）
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message RetrievedChunk {
  int64 record_id = 1;
  string content = 2;
  string title = 3;
  string created_at = 4;
  string content_type = 5;
  repeated string moods = 6;
  float score = 7;
}

message ChatChunk {
  string content = 1;
  bool done = 2;
  repeated Source sources = 3;
  // LLM 思考流（Python 捕获 Anthropic thinking_delta / OpenAI reasoning_content；
  // 与 AI 仓 mirror_chat.proto 字段号 4 对齐）。仅非空时 B 侧转发 SSE thinking 事件
  optional string thinking = 4;
}

message Source {
  int64 record_id = 1;
  string quote = 2;
  string date = 3;
  // 引用编号（正文里的 [n]，1-based；与 AI 仓 mirror_chat.proto 字段号 4 对齐）。
  // Python 只回"回答里被引用到的"子集，编号会跳号——前端必须按 n 定位来源，
  // 不能用数组下标（sources[n-1] 在引用 [5] 而数组只有 2 项时会落空）。
  int32 n = 4;
}

// ── 对话 Agent 循环消息（chat-loop-design.md §3）──
// 循环状态（步数/已执行结果/耗时预算）全在 Java，Python 每次只做单步决策 → 无状态铁律不破

message PlanNextStepRequest {
  string question = 1;                       // 用户原始提问
  repeated GlossaryTerm glossary = 2;        // confirmed 个人词典（与对话同口径）
  repeated ToolSpec tools = 3;               // Java 注册表快照（ToolSpec 定义在 common.proto）
  LlmConfig llm_config = 4;
  // 对话历史（正序）。窗口用 vault.plan-history-rounds=6，与答案侧 HISTORY_ROUNDS=3 故意不同：
  // 那 3 轮是防模型顺着上文措辞跑偏（ChatServiceImpl:65-66），规划器输出 JSON 无此风险，
  // 但"我焦虑怎么办"这类指代消解需要更多上文
  repeated ChatMessage history = 5;
  repeated ToolResult previous_results = 6;  // 已执行步骤的结果（循环的核心输入；首步为空）
  int32 step = 7;                            // 第几步（1-based）
  int32 max_steps = 8;                       // 步数预算，prompt 告知模型"还剩几步"
  bool has_retrieval = 9;                    // RAG 本轮是否有命中（false = 检索空，让模型知道）
}

message PlanStepChunk {
  // 思考增量：Python 用 llm.chat_stream() 捕获（Anthropic thinking_delta /
  // OpenAI 系 reasoning_content），B 逐块转发 SSE thinking。仅非空才发
  optional string thinking = 1;
  repeated PlannedCall calls = 2;  // 仅 final=true 时有效；空 + done=true 表示"材料够了"
  bool done = 3;                   // 仅 final=true 时有效：true = 别再循环
  bool final = 4;                  // 本块是终帧（calls/done 才可读）
}
