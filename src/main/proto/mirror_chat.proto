syntax = "proto3";
package mirror;

import "common.proto";

option java_package = "org.xianshen.mumirrorb.grpc.gen";
option java_outer_classname = "MirrorChatProto";

service MirrorChat {
  rpc ExtractIntent(ExtractIntentRequest) returns (ExtractIntentResponse);
  rpc Chat(ChatRequest) returns (stream ChatChunk);
  // 工具计划（toolcalling-vault-design.md 第 1/6 节）：LLM 按 JSON 约定输出 ≤2 步工具调用计划；
  // 失败/超时(3s)/空计划 → B 侧跳过走现有 RAG，零回归
  rpc PlanTools(PlanToolsRequest) returns (PlanToolsReply);
}

// 工具计划请求
message PlanToolsRequest {
  string question = 1;                    // 用户原始提问
  repeated GlossaryTerm glossary = 2;     // confirmed 个人词典（与对话同口径）
  repeated ToolSpec tools = 3;            // Java 注册表快照（ToolSpec 定义在 common.proto）
  LlmConfig llm_config = 4;
}

// 工具计划响应
message PlanToolsReply {
  repeated PlannedCall calls = 1;         // ≤2 步；空 = 不用工具
}

message PlannedCall {
  string tool = 1;        // 工具名（须在注册表内，否则 B 侧跳过）
  string args_json = 2;   // 参数 JSON 文本（B 侧解析执行）
}

message ExtractIntentRequest {
  string query = 1;
  LlmConfig llm_config = 2;
  repeated GlossaryTerm glossary = 3; // 命中 query 的词条（B 侧 query 匹配，未命中传 top 高频词 grounding）
}

message ExtractIntentResponse {
  // query_type 四选一（英文小写）：profile / structured / semantic / hybrid
  // PROFILE→查画像快照；STRUCTURED→元数据过滤；SEMANTIC→纯向量；HYBRID→过滤+向量+时间衰减
  string query_type = 1;
  optional string content_type = 2;  // 8 类英文小写（todo/thought/learning/plan/note/work/social/health），无法确定则不填
  repeated string moods = 3;         // 13 情绪英文小写
  string time_range = 4;             // 如 "最近7天"，空表示未提及
  string rewritten_query = 5;        // 改写后的检索 query
}

message ChatRequest {
  string question = 1;
  repeated ChatMessage history = 2;
  repeated RetrievedChunk chunks = 3;
  LlmConfig llm_config = 4;
  repeated GlossaryTerm glossary = 5;      // 用户个人词典（confirmed top 30，软约束注入）
  repeated ToolResult tool_results = 6;    // 工具执行结果（PlanTools→执行→塞入；空=未走工具）
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message RetrievedChunk {
  int64 record_id = 1;
  string content = 2;
  string title = 3;
  string created_at = 4;
  string content_type = 5;
  repeated string moods = 6;
  float score = 7;
}

message ChatChunk {
  string content = 1;
  bool done = 2;
  repeated Source sources = 3;
}

message Source {
  int64 record_id = 1;
  string quote = 2;
  string date = 3;
}