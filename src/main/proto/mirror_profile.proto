syntax = "proto3";
package mirror;

import "common.proto";

option java_package = "org.xianshen.mumirrorb.grpc.gen";
option java_outer_classname = "MirrorProfileProto";

service MirrorProfile {
  rpc GenerateProfile(GenerateProfileRequest) returns (GenerateProfileResponse);
}

message GenerateProfileRequest {
  repeated TodoItem todos = 1;
  repeated LearningItem learnings = 2;
  repeated MoodStat mood_stats = 3;
  repeated KeywordStat keywords = 4;
  ActiveTimeStats active_time = 5;
  int32 total_records = 6;
  string time_range = 7;
  LlmConfig llm_config = 8;
  repeated ChatRecord recent_chats = 9;  // 最近会话（优先近 7 天），可为空
  repeated GlossaryTerm glossary = 10;   // 用户个人词典（confirmed top 30，软约束注入）
  // ---- 递归累计镜子（rolling-mirror-design.md §1/§4-B；字段号 11/12/13 与 AI 仓对齐——
  //      原提案 10/11/12 与词典轮 glossary=10 撞号，shared-protocol.md 已登记修正）----
  string prev_mirror = 11;               // ① 上一份镜子全文（overall_summary+五维拼接），空=首份镜子（genesis）
  string correction_index = 12;          // ③ 校正索引（上月镜子涉及记录的 title+日期清单），仅回看深度=0 时传入
  optional int32 mirror_lookback = 13;   // ② 回看深度档位 0-3（默认 1）；optional 区分"未传=缺省1档"与"显式0=纯继承档"
  string stats_facts = 14;               // ④ 待办/统计实况直查文本（B 提案字段，AI 渲染 {stats_facts} 直接引用；忽略则零影响）
}

message TodoItem {
  int64 record_id = 1;
  string title = 2;
  string summary = 3;
  string created_at = 4;
}

message LearningItem {
  int64 record_id = 1;
  string title = 2;
  string summary = 3;
  repeated string keywords = 4;
  string created_at = 5;
}

message MoodStat {
  string mood = 1;
  int32 count = 2;
  float percentage = 3;
}

message KeywordStat {
  string keyword = 1;
  int32 count = 2;
}

message ActiveTimeStats {
  map<string, int32> hour_distribution = 1;
  map<string, int32> weekday_distribution = 2;
  int32 records_last_7_days = 3;
  string peak_hour = 4;
}

message ChatRecord {
  string role = 1;        // user / assistant
  string content = 2;
  string created_at = 3;
}

message GenerateProfileResponse {
  string todo_analysis = 1;
  string learning_analysis = 2;
  string mood_analysis = 3;
  repeated string user_tags = 4;
  string rhythm_analysis = 5;
  string overall_summary = 6;
}
// ---- Java 侧追加（与 AI 侧语义一致，仅补 option 声明，不改字段号） ----
