# ==================== 公共配置 ====================
server:
  port: 9050
  servlet:
    context-path: /api

spring:
  application:
    name: Mu-mirror-B

  # 激活的配置文件（默认开发环境）
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 21MB       # vault 单文件 20MB 上限（业务层 VaultProperties 校验，容器留 1MB 余量给表单）
      max-request-size: 25MB

  # 数据源配置（公共部分）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver

    # Druid 连接池配置（公共）
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控统计
      # filters 移除 wall（E2E 联调修复）：druid wall 防火墙不识别 PostgreSQL 的
      # CROSS JOIN LATERAL 语法（ProfileStatsMapper/DailySummaryMapper 情绪、关键词
      # 统计 SQL），解析抛 ParserException: TODO pos。画像生成接口实测被拦。
      # dev/内网场景保留 stat 监控即可；如需开启 wall 需升级 druid 或改写 SQL。
      filters: stat
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # Security 配置（禁用自动配置，使用自定义 JWT拦截器）
  # security:
  #   basic:
  #     enabled: false  # Spring Boot 3.x 已移除此配置

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: input
  type-aliases-package: org.xianshen.mumirrorb.pojo.DO
  type-handlers-package: org.xianshen.mumirrorb.common.handler
  mapper-locations: classpath:mapper/**/*.xml

# JWT 配置（公共部分）
jwt:
  header: Authorization
  prefix: "Bearer "

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# vault 资产保管（toolcalling-vault-design.md 3.1：全部配置化）
vault:
  max-file-size-bytes: 20971520        # 单文件 20MB
  quota-bytes: 524288000               # 每用户配额 500MB
  digest-max-chars: 100000             # 全消化文本上限（≈5万 token）
  plan-tools-timeout-ms: 3000          # PlanTools 规划超时
  max-tool-calls: 2                    # 单次对话最多工具步数
  find-item-limit: 10
  search-records-limit: 20

# 递归累计镜子（rolling-mirror-design.md §2/§3：四道防洪闸全配置化）
mirror:
  lookback-max-chunks: 600             # 条数闸，超限取最近的
  lookback-max-chars: 150000           # 总字符闸（与条数闸先触发者生效），旧→新裁剪直到塞下
  per-chunk-max-chars: 2000            # 单条日记渲染截断
  mirror-summary-after-months: 12      # 递归链超 N 个月，更早镜子只带一行摘要
