# ==================== 公共配置 ====================
server:
  port: 9050
  servlet:
    context-path: /api

spring:
  application:
    name: Mu-mirror-B

  # 激活的配置文件（打包产物默认走生产配置）
  # 本地开发如需 dev：IDEA 运行配置的 Active profiles 填 dev，
  # 或启动时加 --spring.profiles.active=dev
  profiles:
    active: prod

  servlet:
    multipart:
      max-file-size: 21MB       # vault 单文件 20MB 上限（业务层 VaultProperties 校验，容器留 1MB 余量给表单）
      max-request-size: 25MB

  # 数据源配置（公共部分）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver

    # Druid 连接池配置（公共）
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控统计
      # filters 移除 wall（E2E 联调修复）：druid wall 防火墙不识别 PostgreSQL 的
      # CROSS JOIN LATERAL 语法（ProfileStatsMapper/DailySummaryMapper 情绪、关键词
      # 统计 SQL），解析抛 ParserException: TODO pos。画像生成接口实测被拦。
      # dev/内网场景保留 stat 监控即可；如需开启 wall 需升级 druid 或改写 SQL。
      filters: stat
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # Security 配置（禁用自动配置，使用自定义 JWT拦截器）
  # security:
  #   basic:
  #     enabled: false  # Spring Boot 3.x 已移除此配置

# MyBatis-Plus 配置
mybatis-plus:
  # 驼峰映射等公共配置
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    # 注意：不要在公共配置里开 SQL 日志（log-impl）
    # 它会把 SQL、参数、以及查询结果的每一行（含用户日记原文）全部打印出来，
    # 既淹没日志又泄露隐私。开发环境需要看 SQL 的，见 application-dev.yml。
  global-config:
    db-config:
      id-type: input
  type-aliases-package: org.xianshen.mumirrorb.pojo.DO
  type-handlers-package: org.xianshen.mumirrorb.common.handler
  mapper-locations: classpath:mapper/**/*.xml

# JWT 配置（公共部分）
jwt:
  header: Authorization
  prefix: "Bearer "

# SpringDoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# vault 资产保管（toolcalling-vault-design.md 3.1：全部配置化）
vault:
  max-file-size-bytes: 20971520        # 单文件 20MB
  quota-bytes: 524288000               # 每用户配额 500MB
  digest-max-chars: 100000             # 全消化文本上限（≈5万 token）
  # 规划【单步】超时：必须 < mirror.sse-timeout-ms，否则单步跑满时 SSE 先断
  # （改造前 135000 > SSE 120000，chat-loop-design.md §4.3）
  plan-tools-timeout-ms: 120000       # 2026-09-21 联调后 60s→120s：mimo 单步实测 9~60+s
  max-tool-calls: 2                    # 旧 PlanTools 单次规划路径的步数上限
  # ↓ 对话 Agent 循环（chat-loop-design.md §4.1）
  chat-loop-enabled: true              # 回滚闸：false 退回旧 PlanTools 单次规划
  max-loop-steps: 4                    # 循环步数上限
  loop-budget-ms: 180000               # 循环累计耗时预算（规划+工具执行合计）；联调后 120s→180s
  plan-history-rounds: 6               # 规划器历史窗口（轮），与答案侧 HISTORY_ROUNDS=3 故意不同
  find-item-limit: 10
  search-records-limit: 20

# 递归累计镜子（rolling-mirror-design.md §2/§3：四道防洪闸全配置化）
mirror:
  lookback-max-chunks: 600             # 条数闸，超限取最近的
  lookback-max-chars: 150000           # 总字符闸（与条数闸先触发者生效），旧→新裁剪直到塞下
  per-chunk-max-chars: 2000            # 单条日记渲染截断
  mirror-summary-after-months: 12      # 递归链超 N 个月，更早镜子只带一行摘要
  # 对话检索相关性下限（余弦距离，越小越严；0.35≈相似度0.65，0.45≈0.55 更宽）
  # 超阈值的 chunk 直接丢弃；全部丢弃 → 回答"没有找到相关记录"（宁可不答，不乱答）
  rag-max-cosine-distance: 0.35
  # 对话 SSE 超时（联调后 240s→600s）。最坏情况：意图 60 + 向量化 30 + 循环 180（已开跑的一步
  # 不中途掐断，再 +120）+ 回答流 180 = 570s。只是上限，正常 20~90s 就结束
  sse-timeout-ms: 600000

# 分类语境注入（近 7 天记录摘要：B 侧查 chunks.metadata 组装，Python 侧只渲染不查库）
record-context:
  window-days: 7                       # 近 N 天窗口（records.created_at）
  max-hints: 20                        # 最终注入条数上限（title 去重后取最近 N 条）
  max-query: 50                        # SQL 查询上限（去重前多查兜底）
  max-keywords: 5                      # 每条条目携带 keywords 上限

# 审核模式总闸（false 时强制 manual，前端隐藏 auto 开关）
review:
  auto-enabled: false
