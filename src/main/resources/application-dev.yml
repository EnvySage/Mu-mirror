# ==================== 开发环境配置 ====================
# 开发环境打印 SQL，方便本地调试。
# 注意：会把查询结果的每一行都打出来，仅限本地，切勿用于生产。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

spring:
  # 数据源配置（开发环境）
  datasource:
    url: jdbc:postgresql://localhost:5432/mu_mirror?options=-c%20timezone=Asia/Shanghai
    username: postgres
    password: postgres

    druid:
      stat-view-servlet:
        enabled: false


# JWT 配置（开发环境 - 请修改为你自己的密钥）
jwt:
  secret: dev-jwt-secret-key-for-development-only-change-in-production
  expiration: 86400000  # 24小时

# 日志配置（开发环境 - 输出详细日志）
logging:
  level:
    root: INFO
    org.xianshen.mumirrorb.service.impl: INFO   # 画像/对话主链路（递归累计镜子输入组装日志在此）
    org.xianshen.mumirrorb.grpc: INFO           # gRPC 调用参数观测
    org.xianshen.mumirrorb: WARN
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
springdoc:
  cache:
    disabled: on

# gRPC 配置（AI 服务地址）
grpc:
  client:
    ai-service:
      address: 127.0.0.1:10003       # Python AI 服务地址
      deadline-seconds: 60           # 默认超时（秒）
