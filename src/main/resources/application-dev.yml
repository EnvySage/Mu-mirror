# ==================== 开发环境配置 ====================
spring:
  # 数据源配置（开发环境）
  datasource:
    url: jdbc:postgresql://localhost:5432/mumirror?options=-c%20timezone=Asia/Shanghai
    username: postgres
    password: 123456

  # Redis 配置（开发环境）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

# JWT 配置（开发环境 - 请修改为你自己的密钥）
jwt:
  secret: dev-jwt-secret-key-for-development-only-change-in-production
  expiration: 86400000  # 24小时

# 日志配置（开发环境 - 输出详细日志）
logging:
  level:
    root: INFO
    org.xianshen.mumirrorb: DEBUG
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
springdoc:
  cache:
    disabled: on

# gRPC 配置（AI 服务地址）
grpc:
  client:
    ai-service:
      address: localhost:50051       # Python AI 服务地址
      deadline-seconds: 30           # 默认超时（秒）
